[package]
name = "ams"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
fastembed = { version = "7.5.0", default-features = false, features = ["onnx", "hf-hub-native-tls", "ort-download-binaries-native-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
ureq = { version = "3.5.0", features = ["json"] }

